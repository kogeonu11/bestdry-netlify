[build]
  command = "pnpm build:netlify"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["@netlify/blobs"]

[functions.render]
  included_files = ["dist/index.html"]

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://fonts.googleapis.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://fonts.gstatic.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://*.kakaocdn.net; connect-src 'self'; frame-src https://maps.google.com https://www.google.com https://map.kakao.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'"

[dev]
  framework = "vite"
  command = "pnpm dev"
  targetPort = 3000
  autoLaunch = false

[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
  force = true
